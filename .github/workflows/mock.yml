name: Real provider mock matrix
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        provider: [claude, codex, gemini, copilot, opencode, qwen, pi, kimi, miniplayer, lmplayer, dsh, agy]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - uses: lmctl-ai/lminstall@d48a2cb51ce9a188963c9b97dfebc4aed7076fea
        with:
          providers: ${{ matrix.provider }}
      - name: Private fixture compiler
        run: |
          npm install --prefix "$RUNNER_TEMP/compiler" --no-audit --no-fund @lmctl-ai/lmctl@0.2.448
      - name: Oracle controls and checksummed release
        run: |
          python -m unittest discover -s tests -v
          export LMSCRIPT_JS="$RUNNER_TEMP/compiler/node_modules/@lmctl-ai/lmctl/bin/lmscript"
          python scripts/prepare.py
          python scripts/wire.py "$RUNNER_TEMP/provider-mock-tools/settings.json" artifacts/wire
      - name: Configure, prompt, exact reply, wrong-expectation control, audit
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          python scripts/run.py "$PROVIDER" --settings "$RUNNER_TEMP/provider-mock-tools/settings.json" --out artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mock-${{ matrix.provider }}-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
